
<div class="max-w-5xl mx-auto my-8 px-4">

  <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200">

    <div class="bg-red-600 px-6 py-5">
      <h2 class="text-2xl font-bold text-white">
        Datos del cliente
      </h2>
      <p class="text-red-100 text-sm mt-1">
        Ingresa la información para registrar el pedido.
      </p>
    </div>

    <form [formGroup]="formulario" class="p-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="block mb-2 text-sm font-semibold text-gray-700">
            Nombre completo
          </label>

          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre del cliente"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div>
          <label class="block mb-2 text-sm font-semibold text-gray-700">
            Dirección
          </label>

          <input
            type="text"
            formControlName="direccion"
            placeholder="Dirección del cliente"
            class="w-full px-4 py-3 border border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div>
          <label class="block mb-2 text-sm font-semibold text-gray-700">
            Teléfono
          </label>

          <input
            type="tel"
            formControlName="telefono"
            placeholder="4771234567"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div>
          <label class="block mb-2 text-sm font-semibold text-gray-700">
            Fecha del pedido
          </label>

          <input
            type="date"
            formControlName="fechaPedido"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

      </div>

      <div class="mt-8 pt-6 border-t border-gray-200
                  flex flex-col sm:flex-row justify-between
                  sm:items-center gap-5">

        <div>
          <p class="text-sm text-gray-500">
            Total del pedido
          </p>

          <p class="text-3xl font-bold text-red-600">
            ${{ detalleService.calcularTotal() }}
          </p>
        </div>

        <button
          type="button"
          (click)="terminarPedido()"
          [disabled]="guardando"
          class="bg-red-600 hover:bg-red-700 text-white
                 font-semibold px-8 py-3 rounded-xl
                 shadow-md transition duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed">

          {{ guardando ? 'Guardando...' : 'Terminar pedido' }}

        </button>

      </div>

      @if (mensajeConfirmacion) {

        <div class="mt-5 bg-green-50 border border-green-300
                    text-green-800 px-5 py-4 rounded-xl shadow-sm">

          <p class="font-bold text-lg">
            Pedido confirmado
          </p>

          <p class="mt-1">
            {{ mensajeConfirmacion }}
          </p>

        </div>

      }

    </form>

  </div>

</div>
